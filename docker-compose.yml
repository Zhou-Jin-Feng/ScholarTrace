services:
  scholartrace-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SCHOLARTRACE_DATA_DIR: ${SCHOLARTRACE_DATA_DIR:-/var/lib/scholartrace}
      SCHOLARTRACE_DEPLOYMENT_MODE: ${SCHOLARTRACE_DEPLOYMENT_MODE:-loopback}
      SCHOLARTRACE_AUTH_TOKEN: ${SCHOLARTRACE_AUTH_TOKEN:-}
    ports:
      - "${SCHOLARTRACE_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    volumes:
      - scholartrace-data:/var/lib/scholartrace
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5

  scholartrace-ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      scholartrace-api:
        condition: service_healthy
    ports:
      - "${SCHOLARTRACE_BIND_ADDRESS:-127.0.0.1}:5173:80"

volumes:
  scholartrace-data:
