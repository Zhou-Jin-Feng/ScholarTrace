server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # EventSource/report compatibility can place the shared token in the query string.
    # The API emits its own path-only structured request log.
    access_log off;
    proxy_pass http://scholartrace-api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
