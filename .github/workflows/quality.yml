name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install uv
      - name: Sync dependencies
        run: uv sync --all-groups
      - name: Export schemas
        run: uv run python scripts/export_schemas.py
      - name: Check schema drift
        run: git diff --exit-code -- contracts/schemas
      - name: Test
        run: uv run pytest --basetemp artifacts/pytest
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Mypy
        run: uv run mypy src
      - name: Lock check
        run: uv lock --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install uv==0.12.3
      - run: uv sync --locked --all-groups
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium firefox
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: artifacts/browser-results*
          retention-days: 7
