[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scholartrace"
version = "1.0.2"
description = "Evidence-grounded multi-agent academic research workspace"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx>=0.28.1,<0.29",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1",
  "networkx==3.6.1",
  "pydantic==2.13.4",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
scholartrace-backup = "scholartrace.operations.cli:backup_main"
scholartrace-restore = "scholartrace.operations.cli:restore_main"

[dependency-groups]
dev = [
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "openapi-spec-validator>=0.7.2,<0.8",
  "pytest>=8.4,<10",
  "respx>=0.22,<0.23",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scholartrace"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["scholartrace"]
